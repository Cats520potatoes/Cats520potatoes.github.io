<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111820" />
    <meta name="description" content="何原的在线演示简历" />
    <title>何原 | 演示简历</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="viewer-bar">
      <a href="/" aria-label="返回何原个人主页">何原 · 演示简历</a>
      <span class="page-count" aria-label="当前页码">01 / 01</span>
      <button id="fullscreenButton" type="button" aria-label="进入全屏">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
        </svg>
        <span>全屏</span>
      </button>
    </header>

    <main class="deck-stage">
      <section class="resume-slide" aria-labelledby="slideTitle">
        <div class="slide-shade" aria-hidden="true"></div>
        <div class="cover-copy">
          <h1 id="slideTitle">个人介绍</h1>
          <p>何原</p>
        </div>
      </section>
    </main>

    <footer class="viewer-footer">
      <span>第一张 · 封面</span>
      <span>按 F 进入全屏</span>
    </footer>

    <script src="./app.js"></script>
  </body>
</html>
